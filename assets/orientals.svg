<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">The first three orientals</title>
  <desc id="desc">The first three nontrivial orientals O of Delta 1, Delta 2, and Delta 3, following Street's construction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="3">
    <line x1="75" y1="165" x2="245" y2="165" marker-end="url(#arrow)"/>
    <path d="M365 230 L455 90 L545 230 Z"/>
    <line x1="365" y1="230" x2="545" y2="230" marker-end="url(#arrow)"/>
    <path d="M655 230 L735 85 L815 230 Z"/>
    <path d="M655 230 L815 230"/>
    <line x1="735" y1="85" x2="735" y2="190"/>
  </g>
  <g font-family="DM Sans, Arial, sans-serif" font-size="24" fill="currentColor" text-anchor="middle">
    <text x="160" y="125">O(Δ¹)</text>
    <text x="455" y="285">O(Δ²)</text>
    <text x="735" y="285">O(Δ³)</text>
    <text x="55" y="158">0</text>
    <text x="260" y="158">1</text>
    <text x="455" y="72">1</text>
    <text x="350" y="255">0</text>
    <text x="560" y="255">2</text>
    <text x="735" y="67">1</text>
    <text x="640" y="255">0</text>
    <text x="830" y="255">2</text>
  </g>
</svg>